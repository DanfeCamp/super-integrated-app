name: Deploy on push

on:
  push:
    branches:
      - main

# Two deploys uploading over each other leaves the remote in a mixed state and
# corrupts the action's sync manifest, so pushes queue instead of racing.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      # Restored before `npm ci` so the hash glob does not walk node_modules.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'constants/**', 'hooks/**', 'types/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Trigger Passenger restart on deploy
        run: |
          mkdir -p tmp
          touch tmp/restart.txt

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          exclude: |
            .git/**
            .git**
            .git*/**
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**